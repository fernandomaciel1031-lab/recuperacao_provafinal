<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Digital</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Biblioteca Digital</h1>

      <form id="form-livro">
        <input id="input-titulo" name="titulo" placeholder="Título" />
        <input id="input-autor" name="autor" placeholder="Autor" />
        <input id="input-ano" name="ano" type="number" placeholder="Ano" />
        <button type="submit">Cadastrar livro</button>
      </form>

      <p id="mensagem-erro" class="oculto"></p>
      <ul id="lista-livros"></ul>
    </main>

    <script src="app.js"></script>
  </body>
</html>
